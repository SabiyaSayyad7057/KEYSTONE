<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keystone - Users</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#071a2d;color:#fff}.wrap{max-width:1200px;margin:auto;padding:35px}.top{display:flex;justify-content:space-between;align-items:center}.back{color:#dbaa4b;text-decoration:none}.card{background:#0d2944;border:1px solid #294966;border-radius:16px;padding:22px;margin-top:22px}h1{color:#dbaa4b}input,select{padding:11px;border-radius:8px;border:1px solid #45617a;background:#102b45;color:#fff;margin:5px}button{padding:10px 15px;border:0;border-radius:8px;background:#dbaa4b;color:#07192c;font-weight:700;cursor:pointer}.danger{background:#a94a4a;color:white}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{text-align:left;padding:13px;border-bottom:1px solid #294966}.badge{padding:5px 9px;border-radius:20px;background:#234a67}.msg{padding:12px;border-radius:8px;margin:10px 0}.success{background:#225b45}.error{background:#6f2930}</style></head>
<body><div class="wrap"><div class="top"><div><h1>User Management</h1><p>Manage Keystone users and staff roles</p></div><a class="back" th:href="@{/dashboard}">← Dashboard</a></div>
<div th:if="${success}" class="msg success" th:text="${success}"></div><div th:if="${error}" class="msg error" th:text="${error}"></div>
<div class="card"><h2>Create Staff User</h2><form th:action="@{/users/create}" method="post"><input name="name" placeholder="Name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" minlength="6" required><select name="role"><option value="TECHNICIAN">TECHNICIAN</option><option value="DISPATCHER">DISPATCHER</option><option value="MANAGER">MANAGER</option></select><button>Create User</button></form></div>
<div class="card"><h2>All Users</h2><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Action</th></tr></thead><tbody><tr th:each="u : ${users}"><td th:text="${u.id}">1</td><td th:text="${u.name}">Name</td><td th:text="${u.email}">email</td><td><span class="badge" th:text="${u.role}">CUSTOMER</span></td><td><form th:action="@{'/users/delete/' + ${u.id}}" method="post" onsubmit="return confirm('Delete this user?')"><button class="danger" type="submit">Delete</button></form></td></tr></tbody></table></div></div></body></html>
