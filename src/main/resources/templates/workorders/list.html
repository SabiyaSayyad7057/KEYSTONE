<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keystone | Work Orders</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#06182c;color:#eef4f8}.wrap{max-width:1200px;margin:auto;padding:30px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{color:#dbaa4b;font:700 30px Georgia}.btn{display:inline-block;padding:10px 15px;border-radius:9px;background:#dbaa4b;color:#07192c;text-decoration:none;font-weight:700}.panel{margin-top:24px;background:#0d2944;border:1px solid #ffffff15;border-radius:16px;padding:22px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px;border-bottom:1px solid #ffffff12}th{color:#9fb0bf;font-size:12px}.pill{padding:5px 9px;border-radius:20px;background:#234a67;font-size:12px}.high{background:#67472b}.critical{background:#6f2930}.action{color:#dbaa4b;text-decoration:none}.muted{color:#9fb0bf}@media(max-width:800px){table{font-size:12px}.hide-mobile{display:none}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">KEYSTONE</div><h1>Work Orders</h1><div class="muted" th:text="${currentUser.role.name() == 'CUSTOMER' ? 'Your submitted service requests' : currentUser.role.name() == 'TECHNICIAN' ? 'Jobs assigned to you' : 'Service operations queue'}">Service operations</div></div><div><a class="btn" th:if="${currentUser.role.name() == 'CUSTOMER'}" th:href="@{/work-orders/request}">+ Request Service</a><a class="btn" sec:authorize="hasAnyRole('DISPATCHER','MANAGER')" th:href="@{/work-orders/new}">+ Create Work Order</a></div></div><div class="panel"><div th:if="${#lists.isEmpty(orders)}" class="muted">No work orders found.</div><table th:unless="${#lists.isEmpty(orders)}"><thead><tr><th>Code</th><th>Title</th><th class="hide-mobile">Site</th><th class="hide-mobile">Priority</th><th>Status</th><th>Assigned To</th><th>Action</th></tr></thead><tbody><tr th:each="o:${orders}"><td th:text="${o.code}">WO-1001</td><td th:text="${o.title}">AC Repair</td><td class="hide-mobile" th:text="${o.site.name}">Plant</td><td class="hide-mobile"><span class="pill" th:classappend="${o.priority.name() == 'CRITICAL' ? ' critical' : o.priority.name() == 'HIGH' ? ' high' : ''}" th:text="${o.priority}">HIGH</span></td><td><span class="pill" th:text="${o.status}">NEW</span></td><td th:text="${o.assignee != null ? o.assignee.name : 'Unassigned'}">Unassigned</td><td><a class="action" th:href="@{'/work-orders/' + ${o.id}}">View</a></td></tr></tbody></table></div><p><a class="action" th:href="@{/dashboard}">← Back to dashboard</a></p></div></body></html>
