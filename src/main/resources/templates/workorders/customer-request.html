<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keystone | Request Service</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#06182c;color:#eef4f8}.wrap{max-width:700px;margin:45px auto;padding:30px}.card{background:#0d2944;border:1px solid #ffffff18;border-radius:18px;padding:30px}h1{font:700 32px Georgia;color:#dbaa4b}p{color:#9fb0bf}label{display:block;margin:17px 0 7px}input,textarea,select{width:100%;padding:12px;border-radius:9px;border:1px solid #45617a;background:#102b45;color:#fff}textarea{min-height:120px;resize:vertical}button{margin-top:24px;width:100%;padding:13px;border:0;border-radius:9px;background:#dbaa4b;color:#07192c;font-weight:700}.back{color:#dbaa4b;text-decoration:none}</style></head><body><div class="wrap"><a class="back" th:href="@{/dashboard}">← Dashboard</a><div class="card"><h1>Request Service</h1><p>Tell Keystone what needs attention. Your request will enter the dispatcher queue as a new work order.</p><form th:action="@{/work-orders/request}" method="post"><label>Issue / Service Title</label><input name="title" placeholder="e.g. Air conditioner not cooling" required><label>Description</label><textarea name="description" placeholder="Describe the issue, equipment, symptoms or preferred visit time"></textarea><label>Priority</label><select name="priority" required><option th:each="p:${priorities}" th:value="${p}" th:text="${p}">MEDIUM</option></select><label>Service Site</label><select name="siteId" required><option value="">Select your site</option><option th:each="s:${sites}" th:value="${s.id}" th:text="${s.name + ' — ' + s.address}">Site</option></select><button type="submit">SUBMIT SERVICE REQUEST</button></form></div></div></body></html>
