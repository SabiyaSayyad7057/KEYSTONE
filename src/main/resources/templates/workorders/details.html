<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keystone | Work Order</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#06182c;color:#eef4f8}.wrap{max-width:1000px;margin:auto;padding:30px}.back,.link{color:#dbaa4b;text-decoration:none}.head{display:flex;justify-content:space-between;align-items:start;margin:20px 0}.code{color:#9fb0bf}.title{font:700 34px Georgia;margin:5px 0}.pill{display:inline-block;padding:7px 11px;border-radius:20px;background:#234a67;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#0d2944;border:1px solid #ffffff15;border-radius:16px;padding:22px}.label{color:#91a5b8;font-size:12px;text-transform:uppercase}.value{margin-top:6px}.form{margin-top:18px}select,input,textarea{width:100%;padding:11px;margin-top:8px;border-radius:8px;border:1px solid #45617a;background:#102b45;color:#fff}textarea{min-height:80px}button{padding:11px 16px;margin-top:12px;border:0;border-radius:8px;background:#dbaa4b;color:#07192c;font-weight:700}table{width:100%;border-collapse:collapse}td{padding:10px;border-bottom:1px solid #ffffff12}.muted{color:#9fb0bf}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div th:if="${success}" style="margin:15px 0;padding:12px;border-radius:8px;background:#1f5f3b;color:#fff" th:text="${success}"></div><div th:if="${error}" style="margin:15px 0;padding:12px;border-radius:8px;background:#6f2930;color:#fff" th:text="${error}"></div><div class="wrap"><a class="back" th:href="@{/work-orders}">← Work Orders</a><div class="head"><div><div class="code" th:text="${workOrder.code}">WO</div><div class="title" th:text="${workOrder.title}">Title</div></div><span class="pill" th:text="${workOrder.status}">NEW</span></div><div class="grid"><div class="card"><div class="label">Customer</div><div class="value" th:text="${workOrder.customer.name}">Customer</div><div class="label" style="margin-top:18px">Site</div><div class="value" th:text="${workOrder.site.name}">Site</div><div class="muted" th:text="${workOrder.site.address}">Address</div><div class="label" style="margin-top:18px">Priority</div><div class="value" th:text="${workOrder.priority}">HIGH</div><div class="label" style="margin-top:18px">SLA Due</div><div class="value" th:text="${workOrder.slaDueAt}">date</div></div><div class="card"><div class="label">Description</div><p th:text="${workOrder.description ?: 'No description provided.'}">Description</p><div class="label">Assigned Technician</div><p th:text="${workOrder.assignee != null ? workOrder.assignee.name : 'Awaiting assignment'}">Unassigned</p><div sec:authorize="hasAnyRole('DISPATCHER','MANAGER')" class="form"><label>Assign Technician</label><form th:action="@{'/work-orders/' + ${workOrder.id} + '/assign'}" method="post"><select name="technicianId" required><option value="">Select technician</option><option th:each="t:${technicians}" th:value="${t.id}" th:text="${t.name}">Tech</option></select><button>ASSIGN JOB</button></form></div><div sec:authorize="hasAnyRole('TECHNICIAN','MANAGER')" class="form"><label>Update Status</label><form th:action="@{'/work-orders/' + ${workOrder.id} + '/status'}" method="post"><select name="status" required><option value="">Select next status</option><option th:each="s:${statuses}" th:value="${s}" th:text="${s}">STATUS</option></select><textarea name="note" placeholder="Optional work note"></textarea><button>UPDATE STATUS</button></form></div></div></div><div class="card" style="margin-top:18px"><h2>Status History</h2><div th:if="${#lists.isEmpty(history)}" class="muted">No status changes recorded yet.</div><table th:unless="${#lists.isEmpty(history)}"><tr th:each="h:${history}"><td th:text="${h.changedAt}">date</td><td th:text="${h.fromStatus + ' → ' + h.toStatus}">NEW</td><td th:text="${h.changedBy.name}">User</td><td th:text="${h.note}">Note</td></tr></table></div></div></body></html>
