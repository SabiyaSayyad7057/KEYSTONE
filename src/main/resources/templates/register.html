<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keystone | Customer Registration</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Segoe UI,Arial;background:linear-gradient(135deg,#06182c,#0c3a61);color:#fff;display:flex;align-items:center;justify-content:center;padding:30px}.card{width:520px;padding:38px;border-radius:22px;background:rgba(7,25,45,.9);box-shadow:0 25px 70px #0008;border:1px solid #ffffff1f}.brand{text-align:center;color:#dbaa4b;font:700 34px Georgia}.sub{text-align:center;color:#b9c7d5;margin:8px 0 25px}label{display:block;margin:14px 0 7px;color:#dce6ef}input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #45617a;background:#102b45;color:white;font-size:15px}textarea{min-height:75px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.msg{padding:11px;border-radius:9px;margin:10px 0}.error{background:#6f2930}.success{background:#225b45}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;background:#dbaa4b;color:#07192c;font-weight:700;cursor:pointer}.note{margin-top:18px;padding:12px;border:1px solid #ffffff18;border-radius:10px;color:#9fb0bf;font-size:13px;line-height:1.5}.login{text-align:center;margin-top:18px;color:#b9c7d5}.login a{color:#dbaa4b;text-decoration:none}</style></head>
<body><div class="card"><div class="brand">KEYSTONE</div><div class="sub">Customer Service Portal Registration</div><div th:if="${error}" class="msg error" th:text="${error}"></div>
<form th:action="@{/register}" th:object="${registration}" method="post"><div class="grid"><div><label>Full Name</label><input th:field="*{name}" required></div><div><label>Phone</label><input th:field="*{phone}" required></div></div><label>Email</label><input type="email" th:field="*{email}" required><label>Address</label><textarea th:field="*{address}" placeholder="Company / billing / primary address"></textarea><label>Password</label><input type="password" th:field="*{password}" minlength="6" required><div class="note">New public registrations are <b>CUSTOMER</b> accounts. Staff accounts are created by a Keystone Manager so that customers cannot give themselves technician or manager access.</div><button type="submit">CREATE CUSTOMER ACCOUNT</button></form><div class="login">Already registered? <a th:href="@{/login}">Login here</a></div></div></body></html>
