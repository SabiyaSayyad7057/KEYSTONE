<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Form - Keystone</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    rgba(5, 20, 40, 0.97),
                    rgba(11, 44, 76, 0.94)
                ),
                url("https://images.unsplash.com/photo-1487958449943-2429e8be8625?auto=format&fit=crop&w=2000&q=85");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            flex-direction: column;

            color: #ffffff;
        }

        /* Background decoration */

        body::before {
            content: "";

            position: fixed;

            width: 600px;
            height: 600px;

            right: -250px;
            top: -250px;

            border-radius: 50%;

            background: rgba(218, 169, 75, 0.10);

            box-shadow:
                0 0 120px rgba(218, 169, 75, 0.15);

            pointer-events: none;
        }

        body::after {
            content: "";

            position: fixed;

            width: 450px;
            height: 450px;

            left: -250px;
            bottom: -250px;

            border-radius: 50%;

            background: rgba(31, 108, 180, 0.15);

            pointer-events: none;
        }

        /* Header */

        header {
            height: 85px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 55px;

            background: rgba(4, 20, 37, 0.88);

            border-bottom: 1px solid rgba(255,255,255,0.12);

            backdrop-filter: blur(15px);

            position: relative;
            z-index: 2;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 48px;
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px solid #dbaa4b;

            color: #dbaa4b;

            font-family: Georgia, serif;

            font-size: 27px;

            font-weight: bold;

            clip-path: polygon(
                15% 0,
                85% 0,
                100% 18%,
                90% 100%,
                10% 100%,
                0 18%
            );
        }

        .brand-name {
            font-family: Georgia, serif;

            font-size: 25px;

            letter-spacing: 3px;

            font-weight: bold;
        }

        .brand-subtitle {
            color: #dbaa4b;

            font-size: 9px;

            letter-spacing: 2px;

            margin-top: 3px;
        }

        .header-status {
            color: #c6d3df;

            font-size: 13px;

            display: flex;

            align-items: center;

            gap: 8px;
        }

        .status-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #42c97b;

            box-shadow:
                0 0 10px rgba(66,201,123,0.7);
        }

        /* Navigation */

        nav {
            display: flex;

            align-items: center;

            gap: 8px;

            padding: 14px 55px;

            background: rgba(8, 32, 55, 0.82);

            border-bottom: 1px solid rgba(255,255,255,0.08);

            backdrop-filter: blur(12px);

            position: relative;
            z-index: 2;
        }

        nav a {
            text-decoration: none;

            color: #c7d4e1;

            padding: 10px 17px;

            border-radius: 8px;

            font-size: 14px;

            transition: 0.25s;
        }

        nav a:hover {
            color: white;

            background: rgba(255,255,255,0.09);

            transform: translateY(-1px);
        }

        nav a:first-child {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #1c639e,
                    #2b79bb
                );
        }

        /* Main */

        main {
            flex: 1;

            width: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 50px 20px;

            position: relative;

            z-index: 1;
        }

        /* Form card */

        .form-container {
            width: 500px;

            max-width: 100%;

            padding: 42px;

            border-radius: 22px;

            background:
                rgba(255,255,255,0.96);

            color: #172d45;

            box-shadow:
                0 30px 70px rgba(0,0,0,0.35);

            position: relative;

            overflow: hidden;
        }

        .form-container::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    #145b99,
                    #dbaa4b,
                    #145b99
                );
        }

        /* Form heading */

        .form-header {
            text-align: center;

            margin-bottom: 30px;
        }

        .form-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 16px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #0b2d4d,
                    #185b8e
                );

            color: #dbaa4b;

            font-family: Georgia, serif;

            font-size: 28px;

            box-shadow:
                0 8px 20px rgba(11,45,77,0.25);
        }

        .form-header h1 {
            font-family: Georgia, serif;

            color: #102c49;

            font-size: 30px;

            margin-bottom: 8px;
        }

        .form-header p {
            color: #7c8996;

            font-size: 14px;
        }

        /* Divider */

        .divider {
            display: flex;

            align-items: center;

            gap: 10px;

            margin: 22px 0 28px;
        }

        .divider span {
            flex: 1;

            height: 1px;

            background: #e2e6ea;
        }

        .divider b {
            color: #dbaa4b;

            font-size: 11px;
        }

        /* Form */

        form {
            width: 100%;
        }

        label {
            display: block;

            margin-bottom: 9px;

            color: #293b4f;

            font-size: 14px;

            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;

            height: 52px;

            padding: 0 16px;

            border: 1px solid #d5dce4;

            border-radius: 10px;

            background: #fafbfc;

            color: #172d45;

            font-size: 15px;

            outline: none;

            transition: 0.25s;
        }

        input[type="text"]:focus {
            border-color: #2469ad;

            background: white;

            box-shadow:
                0 0 0 4px rgba(36,105,173,0.10);
        }

        input[type="text"]::placeholder {
            color: #9ba6b1;
        }

        /* Button */

        button {
            width: 100%;

            height: 52px;

            margin-top: 25px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #145d9f,
                    #2877c0
                );

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(20,93,159,0.25);

            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(20,93,159,0.35);
        }

        button:active {
            transform: translateY(0);
        }

        /* Back link */

        .back-section {
            text-align: center;

            margin-top: 22px;

            padding-top: 20px;

            border-top: 1px solid #e6e9ed;
        }

        .back-section a {
            text-decoration: none;

            color: #1764a8;

            font-size: 14px;

            font-weight: 600;

            transition: 0.2s;
        }

        .back-section a:hover {
            color: #0b3d69;

            text-decoration: underline;
        }

        /* Footer */

        footer {
            text-align: center;

            padding: 18px;

            background:
                rgba(3,17,31,0.80);

            border-top: 1px solid rgba(255,255,255,0.08);

            color: #8194a7;

            font-size: 12px;

            position: relative;

            z-index: 2;
        }

        footer span {
            color: #dbaa4b;
        }

        /* Responsive */

        @media (max-width: 700px) {

            header {
                padding: 0 20px;
            }

            .header-status {
                display: none;
            }

            nav {
                padding: 12px 15px;

                overflow-x: auto;
            }

            nav a {
                white-space: nowrap;

                font-size: 12px;

                padding: 8px 12px;
            }

            .form-container {
                padding: 32px 25px;
            }
        }

        @media (max-width: 450px) {

            .brand-name {
                font-size: 20px;
            }

            .brand-subtitle {
                font-size: 7px;
            }

            .logo {
                width: 42px;
                height: 49px;
            }

            .form-header h1 {
                font-size: 26px;
            }

            main {
                padding: 30px 15px;
            }
        }

    </style>

</head>


<body>


<!-- HEADER -->

 <header>

    <div class="logo-section">

        <div class="logo">
            K
        </div>

        <div>

            <div class="brand-name">
                KEYSTONE
            </div>

            <div class="brand-subtitle">
                WORK ORDER MANAGEMENT
            </div>

        </div>

    </div>


    <div class="header-status">

        <span class="status-dot"></span>

        System Online

    </div>

</header>


<!-- NAVIGATION -->

 <nav>

    <a th:href="@{/dashboard}">
        Dashboard
    </a>

    <a th:href="@{/customers}">
        Customers
    </a>

    <a th:href="@{/sites}">
        Sites
    </a>

    <a th:href="@{/work-orders}">
        Work Orders
    </a>

</nav>


<!-- MAIN -->

<main>

    <div class="form-container">


        <!-- FORM HEADER -->

      <div class="form-header">

            <div class="form-icon">
                C
            </div>

            <h1>
                Customer
            </h1>

            <p>
                Add a new customer to your Keystone system
            </p>

        </div>


        <!-- DIVIDER -->

        <div class="divider">

            <span></span>

            <b>◆</b>

            <span></span>

        </div>


        <!-- CUSTOMER FORM -->

        <form
            th:action="@{/customers/save}"
            th:object="${customer}"
            method="post">


            <input
                type="hidden"
                th:field="*{id}">


            <label for="name">
                Customer Name
            </label>


            <input
                type="text"
                id="name"
                th:field="*{name}"
                placeholder="Enter customer name"
                required>


            <button type="submit">
                ✓ &nbsp; Save Customer
            </button>


        </form>


        <!-- BACK -->

        <div class="back-section">

            <a th:href="@{/customers}">
                ← Back to Customers
            </a>

        </div>


    </div>

</main>


<!-- FOOTER -->

<footer>

    Keystone Work Order Management System
    &nbsp; • &nbsp;
    <span>Customer Management</span>

</footer>


</body>

</html>
